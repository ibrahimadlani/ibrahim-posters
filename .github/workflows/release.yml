name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: image (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suffix: [musl, gnu]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Built once, inside the image. The host cargo build the first version
      # ran was redundant: the Dockerfile compiles from source anyway, so the
      # binary it produced was discarded.
      - name: Build and load for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.suffix }}
          push: false
          load: true
          tags: poster-service:${{ matrix.suffix }}
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}

      # Nothing should be published that has not been started at least once.
      - name: Smoke test before publishing
        run: |
          set -euo pipefail
          docker run -d --name poster -p 8080:8080 \
            -e POSTER_BIND_ADDR=0.0.0.0:8080 \
            -e POSTER_STORAGE_BACKEND=memory \
            poster-service:${{ matrix.suffix }}

          for attempt in $(seq 1 30); do
            curl -sf localhost:8080/readyz >/dev/null && break
            sleep 1
          done

          curl -sf localhost:8080/healthz | grep -q ok
          curl -sf localhost:8080/v1/presets | grep -q standard
          curl -sf localhost:8080/metrics | grep -q poster_
          docker rm -f poster

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.suffix }}
          push: true
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.suffix }}

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
