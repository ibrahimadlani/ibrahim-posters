name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request makes the previous run's answer irrelevant, so
# cancel it rather than paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug symbols are the bulk of the target directory and CI never opens a
  # debugger; dropping them makes the cache meaningfully smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings

jobs:
  # Jobs are split so a failure names itself in the checks list. A single
  # "build" job that runs everything reports "build failed", which costs a log
  # dive to learn what a job name could have said outright.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Beta is advisory: it warns about breakage a release ahead without
      # blocking a merge on a toolchain nothing ships against.
      matrix:
        toolchain: [stable, beta]
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    env:
      # Without this the pin in rust-toolchain.toml wins and both matrix legs
      # run 1.98.0, so the beta leg reports a pass it never earned.
      # RUSTUP_TOOLCHAIN takes precedence over the file.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --all-features
      # nextest does not run doc tests, and every public item is documented
      # with an example that is required to compile.
      - run: cargo test --doc --all-features

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      # Coverage is gated on src/render/ and src/spec/ only, from M1 onward.
      # A crate-wide percentage would be satisfied by testing main.rs wiring
      # and would say nothing about the two modules where a bug is either a
      # visual defect or a cache-poisoning event.
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  build-release:
    name: build-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # rust-toolchain.toml pins 1.98.0, and rustup honours it over whatever
      # the action just selected. Adding the target to `stable` therefore adds
      # it to the wrong toolchain, and the build fails on a missing `core`.
      # Add it to the toolchain that will actually be active.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The webp crate builds libwebp from source. musl needs a cross linker,
      # and this is the job that proves the static image is buildable before a
      # release depends on it. See PLAN.md section 14.2.
      - name: Install musl toolchain
        if: endsWith(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}

  # The release images were built by CI but never executed, so nothing
  # confirmed the binary actually starts inside them. A statically linked
  # binary on `scratch` has exactly the failure mode this catches: it compiles,
  # links, and then cannot find a certificate store or a loader at runtime.
  image-smoke-test:
    name: image-smoke-test (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: musl
          - suffix: gnu
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.suffix }}
          push: false
          load: true
          tags: poster-service:${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

      - name: Start the container
        run: |
          docker run -d --name poster \
            -p 8080:8080 \
            -e POSTER_BIND_ADDR=0.0.0.0:8080 \
            -e POSTER_STORAGE_BACKEND=memory \
            poster-service:${{ matrix.suffix }}

      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf localhost:8080/readyz >/dev/null; then
              echo "ready after ${attempt} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "the container never became ready"
          docker logs poster
          exit 1

      - name: Exercise the endpoints
        run: |
          set -euo pipefail

          curl -sf localhost:8080/healthz | grep -q ok
          curl -sf localhost:8080/v1/presets | grep -q standard
          curl -sf localhost:8080/metrics | grep -q poster_requests_total

          # A poster the service cannot fetch: this exercises validation,
          # hashing and the storage write without needing network egress to
          # TMDB from a CI runner.
          key=$(curl -sf -X POST localhost:8080/v1/posters \
            -H 'content-type: application/json' \
            -d '{"source":"/kqjL17yufvn9OVLyXYpvtyrFfak.jpg"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["key"])')
          test "${#key}" -eq 64

          # And that a rejection is a problem document rather than a crash.
          curl -s -X POST localhost:8080/v1/posters \
            -H 'content-type: application/json' \
            -d '{"source":"https://evil.test/x.jpg"}' \
            | grep -q invalid_poster_path

      - name: Report image size
        run: docker image inspect poster-service:${{ matrix.suffix }} --format '{{.Size}}' | numfmt --to=iec

      - name: Show logs on failure
        if: failure()
        run: docker logs poster
