# git-cliff configuration. The changelog is generated from commit subjects, so
# Conventional Commits are load-bearing rather than decorative.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.

The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Entries below are generated from commit subjects by
[git-cliff](https://git-cliff.org); regenerate with `git cliff -o CHANGELOG.md`.
"""
body = """
{% if version %}\
\n
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
commit_parsers = [
  # Breaking changes lead, whatever their type. A reader scanning a changelog
  # is asking "will this break me" before "what is new", and a `feat!` filed
  # under Added answers the second question while hiding the first.
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = ".*BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Changed" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  # `chore` is grouped rather than skipped. Skipping it made v1.0.0 vanish
  # from the changelog entirely, because every commit in that release was a
  # chore -- and a release with no entry is worse than a noisy one.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "<!-- 7 -->Maintenance" },
  # `ci` and `build` stay skipped: they change how the project is built, not
  # what it does, and a reader of a changelog is asking the second question.
  { message = "^(ci|build)", skip = true },
  { message = "^revert", group = "<!-- 8 -->Reverted" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
