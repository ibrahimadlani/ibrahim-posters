# Preset catalogue, embedded at compile time via include_str!.
#
# Geometry is authored at w1000 and scaled by OutputWidth::scale, so a preset
# describes one layout rather than one layout per output size.
#
# Adding or changing a preset changes the resolved specifications it produces,
# and therefore the cache keys derived from them. That is handled correctly by
# construction -- the key is a hash of the resolved values, not of the preset
# name -- so an edited preset simply produces new keys and leaves the old
# renders reachable by their own keys.

[standard]
# The default, and the only preset that reproduces the reference treatment:
# a tinted band, an inset shadow under the top edge, and a single full-width
# badge coloured from the artwork.
blur_band_fraction = 0.30
blur_sigma = 24.0
# Nearly opaque, because the band is a ground for the logo rather than a
# darkened view of the artwork. What keeps the artwork present is the blur
# above the ramp's peak, not the ramp letting colour through at the bottom.
darken_strength = 0.94
# A dark warm neutral rather than black. Blending toward a colour gives every
# poster the same footing at the bottom edge whatever its own palette, which
# is what makes a wall of them read as one set.
band_colour = "#2b0503"
# Saturating rather than the default quadratic: the band is a ground the logo
# sits on, so the tint arrives early and is complete well before the bottom
# edge, leaving the artwork visible only through the band's upper reaches.
band_ramp_fraction = 0.65
# The badge sits on artwork the service does not choose, so the top of the
# frame is darkened to give it a predictable ground.
top_shadow_strength = 0.85
top_shadow_fraction = 0.25
logo_width_fraction = 0.60
logo_bottom_fraction = 0.12
# A bar across the top rather than a pill: fixed width, flush with the edge,
# and coloured from the poster it sits on.
badge_height = 140
badge_width_fraction = 0.50
badge_top_fraction = 0.0
badge_from_artwork = true
caption_height = 88
caption_bottom_fraction = 0.107
caption_colour = "#b8a8a0"

[cinematic]
# Taller band and a heavier ramp, for artwork with a busy lower half where a
# lighter treatment leaves the logo competing with detail.
blur_band_fraction = 0.42
blur_sigma = 36.0
darken_strength = 0.72
logo_width_fraction = 0.66
logo_bottom_fraction = 0.14
badge_height = 44

[minimal]
# Barely-there treatment for artwork that already has clean negative space at
# the bottom. Low sigma keeps the underlying image legible.
blur_band_fraction = 0.18
blur_sigma = 12.0
darken_strength = 0.35
logo_width_fraction = 0.50
logo_bottom_fraction = 0.09
badge_height = 36

[poster_wall]
# Sized for thumbnail grids: a larger logo and taller badges survive being
# displayed at a fraction of native resolution.
blur_band_fraction = 0.34
blur_sigma = 28.0
darken_strength = 0.62
logo_width_fraction = 0.74
logo_bottom_fraction = 0.10
badge_height = 56
