# cargo-deny policy. Run with: cargo deny check
#
# The imaging stack pulls a wide dependency graph (resvg, tiny-skia, libwebp
# bindings), so licence and advisory drift is a real risk rather than a
# theoretical one. This file is the gate.

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. The service is intended to be deployable as a
# closed-source container image, so copyleft in the dependency graph would be
# a licensing problem rather than a preference.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# ring vendors BoringSSL-derived code; upstream ships no single SPDX
# expression, so the combination is stated explicitly here.
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # OpenSSL would add a system dependency that defeats the static musl build
    # used for the release image; rustls is used instead.
    { name = "openssl-sys", reason = "use rustls; keeps the musl image statically linkable" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
