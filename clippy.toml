# Keep cognitive load low in the render pipeline, where long straight-line
# pixel code is easy to write and hard to read.
cognitive-complexity-threshold = 20

# Poster geometry is expressed in f32 throughout, so the small unsuffixed
# literals in gradient ramps and blur kernels are intentional.
allow-mixed-uninlined-format-args = false

# Note: the render/ module boundary is NOT enforced here. clippy.toml applies
# to the whole crate, so a `disallowed-types` entry for reqwest::Client would
# also fire in state.rs, where the client legitimately lives. The boundary is
# enforced by tests/module_boundary.rs instead, which can scope its check to a
# directory.
